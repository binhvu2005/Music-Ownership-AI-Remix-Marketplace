services:
  postgres:
    image: postgres:16-alpine
    container_name: stemverse-postgres
    restart: always
    ports:
      - '5433:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=stemverse
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: stemverse-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: stemverse-meilisearch
    restart: always
    ports:
      - '7700:7700'
    environment:
      - MEILI_MASTER_KEY=meilimasterkey
      - MEILI_ENV=development
    volumes:
      - meili_data:/meili_data

  ai-service:
    build:
      context: ./code/ai-service
      dockerfile: Dockerfile
    container_name: stemverse-ai-service
    restart: always
    ports:
      - '8000:8000'
    volumes:
      - ./code/ai-service:/app
    environment:
      - STORAGE_ENDPOINT=https://7a7c0c77b860c4763bbe740c158511dd.r2.cloudflarestorage.com
      - STORAGE_ACCESS_KEY_ID=208f6217a63cd8f95d020ef2aaa5fc2d
      - STORAGE_SECRET_ACCESS_KEY=fbe8eb8e45a4287dbc03e4de2e63e654017a7a032002632c7521ac9b094c5d54
      - STORAGE_BUCKET_NAME=music
    depends_on:
      - redis

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  meili_data:
    driver: local
