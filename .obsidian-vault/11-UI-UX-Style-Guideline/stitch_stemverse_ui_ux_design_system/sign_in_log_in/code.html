<style>
        body {
            background-color: #0B0F19; /* Deep Slate Background */
            font-family: 'Geist', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(31, 41, 55, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(45, 55, 72, 0.5);
            position: relative;
        }
        .glass-card::before {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: 0.75rem;
            padding: 1px;
            background: linear-gradient(135deg, #8B5CF6 0%, transparent 40%, transparent 60%, #8B5CF6 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        .primary-glow:hover {
            box-shadow: 0 0 15px 2px rgba(139, 92, 246, 0.4);
        }
        .input-focus:focus-within {
            border-color: #8B5CF6;

<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight">Welcome back</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Sign in to access your studio</p>
</div>
<!-- Login Form -->
<form class="space-y-5" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Email Address</label>
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-lg py-3 pl-11 pr-4 text-on-surface placeholder:text-outline focus:outline-none focus:ring-1 focus:ring-primary transition-all font-body-md text-body-md" id="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-1.5">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed-dim transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-lg py-3 pl-11 pr-11 text-on-surface placeholder:text-outline focus:outline-none focus:ring-1 focus:ring-primary transition-all font-body-md text-body-md" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3.5 flex items-center justify-center text-outline hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="pw-icon">visibility</span>
</button>
</div>
</div>
<!-- Primary Sign In Action -->
<button class="w-full bg-primary-container text-on-primary-container font-label-md text-label-md py-4 rounded-lg primary-glow transition-all active:scale-[0.98] mt-2" type="submit">
                    Sign In
                </button>
</form>

<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>

                    Don't have an account?

</p>

</div>
<!-- Atmospheric Background Elements (Micro-interactions) -->
<div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/10 blur-[120px] rounded-full pointer-events-none -z-10 animate-pulse"></div>
<div class="fixed bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-secondary/5 blur-[120px] rounded-full pointer-events-none -z-10"></div>
</main>
<script>
        function togglePassword() {
            const pwField = document.getElementById('password');
            const pwIcon = document.getElementById('pw-icon');
            
            if (pwField.type === 'password') {
                pwField.type = 'text';
                pwIcon.textContent = 'visibility_off';
            } else {
                pwField.type = 'password';
                pwIcon.textContent = 'visibility';
            }
        }

        // Add subtle mouse-tracking glow to card
        document.addEventListener('mousemove', (e) => {
            const card = document.querySelector('.glass-card');
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (x > 0 && x < rect.width && y > 0 && y < rect.height) {
                card.style.setProperty('--mouse-x', `${x}px`);
                card.style.setProperty('--mouse-y', `${y}px`);
            }
        });
    </script>
